#!/bin/sh
# Perfetto config: capture the app's own atrace markers (HWUI/View/Compose sections) plus the
# scheduler, so a slow Compose frame can be attributed to composition / layout / draw-record /
# render-thread instead of guessed at from gfxinfo percentiles.
buffers { size_kb: 65536 fill_policy: RING_BUFFER }
data_sources {
  config {
    name: "android.ftrace"
    ftrace_config {
      ftrace_events: "sched/sched_switch"
      ftrace_events: "power/suspend_resume_kernel"
      atrace_categories: "view"
      atrace_categories: "gfx"
      atrace_categories: "wm"
      atrace_categories: "am"
      atrace_categories: "dalvik"
      atrace_categories: "res"
      atrace_categories: "binder_driver"
      atrace_apps: "yos.music.player.oss"
    }
  }
}
duration_ms: 6000
