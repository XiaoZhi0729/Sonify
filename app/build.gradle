plugins {
    id 'com.android.application'
    id 'kotlin-parcelize'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'yos.music.player'
    compileSdk 37

    defaultConfig {
        applicationId "com.sonify.music"
        minSdk 23
        targetSdk 34
        // 版本号单一来源在根目录 gradle.properties（APP_VERSION_*），在此读取
        versionCode APP_VERSION_CODE.toInteger()
        versionName APP_VERSION_NAME

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 不生成矢量图标的位图回退。
        //
        // 默认 minSdk < 24 时 AGP 会把每个 drawable 矢量栅格化成
        // drawable-{ldpi..xxxhdpi}-v4/*.png（本项目 306 个），打包进 APK。
        // 资源匹配里 `-xxxhdpi` 比 `-anydpi-v24` 更具体，于是高密度设备
        // （本机 520dpi）**永远加载 PNG，XML 矢量被完全绕过**。
        //
        // 后果不只是多占体积：改矢量 XML（换路径、调圆角、改比例）在真机上
        // 毫无变化，因为屏幕上是位图。人声分离药丸与翻译按钮的图标尺寸/圆角
        // 对不齐就是这个原因，排查了两轮才定位。
        //
        // minSdk 23 仍然安全：VectorDrawableCompat 走 appcompat 即可渲染，
        // 且本项目 AppCompat 1.7.0 已在依赖里。
        vectorDrawables.generatedDensities = []

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }

    }

    buildTypes {
        release {
            minifyEnabled true
            zipAlignEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        compose true
        // ArtistPerfProbe 用 BuildConfig.DEBUG 把诊断探针限制在 debug 包
        buildConfig true
    }

    testOptions {
        // 音质解析链在 JVM 单测里会走 android.util.Log（QualityTrace）：
        // 返回默认值而不是抛"not mocked"，使 A1/A6 这类数据层断言能纯 JVM 验证
        unitTests.returnDefaultValues = true
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["libs"]
        }
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            useLegacyPackaging true
        }
    }

    androidResources {
        // 模型权重已压缩过，再 zip 一遍既无收益又要整包解压才能读；
        // 保持不压缩才能用 AssetManager.openFd 拿长度/偏移。
        noCompress 'tflite'
    }

    composeCompiler {
        enableStrongSkippingMode = true
        stabilityConfigurationFile = file "${project.rootDir}/stability_config.conf"
    }

}

dependencies {
    implementation fileTree(include: ["*.*"], dir: "libs")
    implementation project(':overscroll_core')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.activity:activity-compose:1.9.1'
    // 运行时经 activity-compose 1.13.0 传递引入；AppTabsShell 直接 provide 其
    // LocalNavigationEventDispatcherOwner 做 house 级返回隔离，需编译期可见
    implementation 'androidx.navigationevent:navigationevent-compose:1.0.0'

    implementation "androidx.compose.foundation:foundation:1.10.2"
    implementation "androidx.compose.animation:animation:1.10.2"
    implementation "androidx.compose.ui:ui:1.10.2"
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.compose.runtime:runtime-livedata:1.10.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation "androidx.compose.foundation:foundation:1.10.2"
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    // 歌词渲染：第三方库（扫色前沿 / 辉光 / 逐字动画 / 行 reveal）
    // lyrics-ui 的 POM 把 lyrics-core-jvm 标成 runtime scope，但其公开 API 暴露了 core 的类型，
    // 必须显式再声明一次才能进 compile classpath。
    implementation "com.mocharealm.accompanist:lyrics-ui:2.0.0-rc.2-patched10"
    implementation "com.mocharealm.accompanist:lyrics-core-jvm:0.5.0"

    // 液态玻璃：backdrop 已按官方 fork 源码移植进 app/src/main/java/com/kyant/backdrop
    // （不再依赖 io.github.kyant0:backdrop:1.0.5 —— 该 artifact 缺 obtainGraphicsLayer()
    //   按需建层路径，会导致 drawBackdrop 走「直采」分支、玻璃层无输出）
    implementation "io.github.kyant0:shapes:1.0.0"
    // fork 的 AGSL 注解（@Language("AGSL")）
    implementation "org.jetbrains:annotations:26.1.0"

    // 关于页横幅连点 10 次的彩带（与 Cresto 同版本、同参数）
    implementation "io.github.vinceglb:confettikit:0.8.0"

    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'androidx.compose.material:material-icons-core:1.6.8'
    implementation 'androidx.compose.material:material-icons-extended:1.6.8'

    implementation "io.coil-kt:coil-compose:2.5.0"

    // 艺人详情页头像取色（Palette 主色 → 页面背景/渐变过渡）
    implementation "androidx.palette:palette-ktx:1.0.0"

    // 封面取色背景：HCT 色彩空间 + QuantizerCelebi 量化 + Score 选种子色 +
    // TonalPalette 生成同色系明度阶梯（与 Android 12 Monet 同源算法）。
    // 选这个纯 Java 移植版而不是 com.google.android.material:material：
    // 后者会把 RecyclerView / ViewPager2 / CoordinatorLayout / Fragment 整套 View
    // 体系拖进一个纯 Compose 工程，只为拿 4 个色彩类，代价太大。
    implementation "me.tatarka.google.material:material-color-utilities:0.1.2"

    implementation 'com.google.accompanist:accompanist-insets:0.16.1'
    implementation 'com.google.accompanist:accompanist-insets-ui:0.16.1'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation "com.google.accompanist:accompanist-systemuicontroller:0.23.1"

    implementation('com.blankj:utilcodex:1.31.1') {
        exclude group: 'androidx.appcompat'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-android-extensions-runtime'
    }

    def media3_version = "1.4.0"
    implementation "androidx.media3:media3-session:$media3_version"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-exoplayer-dash:$media3_version"
    implementation "androidx.media3:media3-datasource:$media3_version"
    // 绕过系统代理的直连数据源（代理被后台冻结/断流时兜底，见 KugouMediaSource.OnlineProxyHealth）
    implementation "androidx.media3:media3-datasource-okhttp:$media3_version"

    implementation 'com.tencent:mmkv-static:1.3.5'

    implementation 'com.google.code.gson:gson:2.10.1'

    // POC Native online music playback - OkHttp for Rust server client
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation 'com.github.xiaowine:Lyric-Getter-Api:6.0.0'

    implementation "com.github.Kyant0:taglib:1.0.0-alpha22"

    implementation "com.google.accompanist:accompanist-pager:0.20.2"

    implementation 'androidx.appcompat:appcompat:1.7.0'

    implementation('io.github.alexzhirkevich:cupertino:0.1.0-alpha04')
    implementation('io.github.alexzhirkevich:cupertino-icons-extended:0.1.0-alpha04')

    implementation "androidx.core:core-splashscreen:1.0.1"

    implementation "com.github.FunnySaltyFish.ComposeDataSaver:data-saver:1.1.9"

    implementation "com.github.promeg:tinypinyin:2.0.2"

    implementation("dev.chrisbanes.haze:haze:2.0.1")
    implementation("dev.chrisbanes.haze:haze-blur:2.0.1")
    implementation("dev.chrisbanes.haze:haze-blur-materials:2.0.1")

    // 人声分离实时推理（TFLite 解释器）
    // -api 件不可省：Interpreter/Tensor 的公开类型在 api artifact 里，缺了会报
    // "Tensor not found"；-gpu 两件只为补类，不挂 delegate（旧 GpuDelegate 在部分
    // SoC 驱动上会 SIGSEGV，Java 层拦不住，本功能只走 CPU + XNNPACK）
    implementation "org.tensorflow:tensorflow-lite:2.16.1"
    implementation "org.tensorflow:tensorflow-lite-api:2.16.1"
    implementation "org.tensorflow:tensorflow-lite-gpu:2.16.1"
    implementation "org.tensorflow:tensorflow-lite-gpu-api:2.16.1"
}